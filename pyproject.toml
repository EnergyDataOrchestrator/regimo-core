[project]
name = "regimo-core"
version = "0.2.0"
description = "Foundational library and base abstractions for the Regimo Energy Data Orchestrator: ontology-aware Kafka communication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "httpx>=0.27",
    "click>=8.1",
    "fuseki-proto-tool[agnostic]>=0.1.0",  # CF2-004 agnostic-trip transform for the sync engine
]

[tool.uv.sources]
fuseki-proto-tool = { path = "../infrastructure/fuseki-proto/tool", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
regimo-core = "regimo_core.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: tests that run against a real Kafka bus (auto-skipped when none is reachable)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regimo_core"]
